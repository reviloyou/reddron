; Pillar B mission computer firmware, ESP32-DEV-30P.
;
; One PlatformIO project with one environment per program. Each
; environment compiles only its own sources (build_src_filter), so the
; programs never link against each other's setup() and loop().
;
;   pio run -e mlx90640_stream -t upload        thermal camera streamer (F3)
;   pio run -e pillarb_stream -t upload         the camera streamer plus the FC link, one clock
;   pio run -e mavlink_request -t upload        MAVLink stream setup, real FC on UART1 (F2)
;   pio run -e mavlink_request_sitl -t upload   the same, against SITL over WiFi (F2)
;   pio run -e sd_check -t upload               SD card mount, preallocate and write test
;
; HARDWARE_GUIDE.md explains every line.

[platformio]
description = Pillar B mission computer firmware (ESP32-DEV-30P)
default_envs = mlx90640_stream

[env]
; Pinned. espressif32 7.0.1 ships Arduino-ESP32 core 2.0.17; a later
; platform can move to core 3.x, which changes APIs this code uses.
platform = espressif32 @ 7.0.1
board = esp32dev
framework = arduino
build_flags = -Wall

[env:mlx90640_stream]
build_src_filter = +<mlx90640_stream.cpp>
monitor_speed = 921600

[env:pillarb_stream]
; The camera streamer with the MAVLink link of mavlink_request.cpp in the
; same program, so subpages and attitude are stamped by one micros().
; Mapping the ESP32 clock onto the flight controller's (clock_sync.py)
; needs both on one clock: two programs on two boards would give two
; unrelated ones. Attitude goes to the laptop as MLXA packets.
build_src_filter = +<mlx90640_stream.cpp> +<mavlink_request.cpp>
build_flags = ${env.build_flags} -DPILLARB_WITH_MAVLINK
lib_deps = okalachev/MAVLink @ 2.0.33
monitor_speed = 921600

[env:mavlink_request]
build_src_filter = +<mavlink_request.cpp> +<mavlink_request_main.cpp>
lib_deps = okalachev/MAVLink @ 2.0.33
monitor_speed = 115200

[env:mavlink_request_sitl]
extends = env:mavlink_request
build_flags = ${env.build_flags} -DPILLARB_SITL_TCP

[env:sd_check]
build_src_filter = +<sd_check.cpp>
; SdFat, not the core's SD.h: it reads exFAT, so a 64 GB SDXC card works as
; shipped, and it can preallocate a contiguous file.
lib_deps = greiman/SdFat @ 2.3.1
monitor_speed = 115200
